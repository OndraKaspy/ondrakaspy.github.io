<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Interaktivní graf y = A sin(Bx + C) + D | OndraKaspy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #080d1a;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Touch-friendly range sliders */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: currentColor;
      border: 2px solid #0f172a;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      transition: transform 0.12s ease;
    }
    input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(1.25);
    }
    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: currentColor;
      border: 2px solid #0f172a;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      transition: transform 0.12s ease;
    }
    input[type="range"]::-moz-range-thumb:active {
      transform: scale(1.25);
    }
  </style>
</head>
<body class="w-full min-h-screen lg:h-screen flex flex-col p-2 sm:p-4 gap-2 sm:gap-3 box-border overflow-x-hidden lg:overflow-hidden">

  <!-- 1. HEADER: Title, Equation, Presets & Fullscreen toggle -->
  <header class="w-full shrink-0 bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl px-3 sm:px-4 py-2 sm:py-2.5 shadow-lg flex flex-wrap items-center justify-between gap-2.5">
    
    <!-- Title & Dynamic Equation -->
    <div class="flex flex-wrap items-center gap-2 sm:gap-3">
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-sky-500/10 border border-sky-500/30 text-sky-400 font-bold text-xs mono">
          f(x)
        </span>
        <h1 class="text-xs sm:text-sm font-semibold tracking-tight text-slate-200 hidden sm:inline-block">
          Goniometrické funkce
        </h1>
      </div>

      <!-- Live Formula -->
      <div class="flex items-center gap-1.5 bg-slate-950/80 border border-slate-800 px-2.5 py-1 rounded-lg text-xs sm:text-sm font-semibold mono tracking-tight">
        <span class="text-slate-400">y =</span>
        <span id="eqText" class="text-slate-100 font-bold">2·sin(x) + 1</span>
      </div>
    </div>

    <!-- Actions & Presets -->
    <div class="flex items-center flex-wrap gap-1.5 ml-auto">
      <button id="btnNotebook" type="button" title="Příklad ze sešitu"
        class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 hover:bg-indigo-500/30 active:scale-95 transition flex items-center gap-1">
        <span>📖 Ze sešitu</span>
        <span class="hidden md:inline text-[11px] opacity-80">(10 sin(3x+π)+3)</span>
      </button>

      <button id="btnCos" type="button" title="Kosinus (fázový posun +π/2)"
        class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-purple-500/20 text-purple-300 border border-purple-500/40 hover:bg-purple-500/30 active:scale-95 transition">
        cos(x)
      </button>

      <button id="btnReset" type="button" title="Základní funkce"
        class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 active:scale-95 transition">
        sin(x)
      </button>

      <!-- Fullscreen Toggle Button -->
      <button id="btnFullscreen" type="button" title="Přepnout celou obrazovku"
        class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800/90 text-slate-300 border border-slate-700 hover:bg-slate-700 hover:text-white active:scale-95 transition flex items-center gap-1.5">
        <svg id="fsIconExpand" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
        </svg>
        <span class="hidden sm:inline">Celá obrazovka</span>
      </button>
    </div>
  </header>

  <!-- 2. MAIN GRAPH CANVAS (Fills available space on desktop, min-h on mobile) -->
  <main class="w-full flex-1 min-h-[280px] sm:min-h-[340px] lg:min-h-0 bg-slate-950/90 border border-slate-800 rounded-xl relative overflow-hidden shadow-xl flex flex-col">
    <canvas id="sineCanvas" class="w-full h-full block touch-none cursor-crosshair"></canvas>

    <!-- Canvas Header Overlays (Legend & Dynamic Inspector Tooltip) -->
    <div class="absolute top-2 left-2.5 right-2.5 flex items-center justify-between pointer-events-none gap-2">
      <!-- Legend -->
      <div class="flex items-center flex-wrap gap-2 sm:gap-3 bg-slate-900/85 backdrop-blur px-2.5 py-1 rounded-lg border border-slate-800 text-[11px] text-slate-300 shadow">
        <span class="flex items-center gap-1.5">
          <span class="inline-block w-3 h-1 bg-sky-400 rounded-full"></span>
          <span class="font-medium text-slate-100">A·sin(Bx+C)+D</span>
        </span>
        <span class="flex items-center gap-1.5">
          <span class="inline-block w-3 border-b-2 border-dashed border-slate-400"></span>
          <span class="text-slate-400">sin(x)</span>
        </span>
        <span class="hidden sm:flex items-center gap-1.5">
          <span class="inline-block w-3 border-b-2 border-dotted border-amber-400"></span>
          <span class="text-amber-400/90">osa y=D</span>
        </span>
      </div>

      <!-- Hover / Touch Coordinate Badge -->
      <div id="hoverCoords" class="hidden bg-slate-900/90 backdrop-blur px-2.5 py-1 rounded-lg border border-sky-500/40 mono text-[11px] text-sky-200 shadow-md">
        x: 0 | y: 0
      </div>
    </div>

    <!-- Mobile Hint (Hidden once user interacts) -->
    <div id="mobileHint" class="absolute bottom-2 right-2.5 pointer-events-none text-[10px] text-slate-500 bg-slate-900/70 px-2 py-0.5 rounded border border-slate-800 sm:hidden">
      Dotkněte se grafu pro odečet bodů
    </div>
  </main>

  <!-- 3. CONTROLS FOOTER: Info Cards & Sliders (Shrink-0) -->
  <footer class="w-full shrink-0 flex flex-col gap-2 sm:gap-2.5">
    
    <!-- 3 Properties Badges -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
      <!-- Perioda -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl px-3 py-1.5 sm:py-2 flex items-center justify-between sm:flex-col sm:justify-center text-center shadow-sm">
        <span class="text-[11px] text-slate-400">Perioda <span class="mono text-emerald-400 font-semibold">T = 2π/|B|</span></span>
        <span id="valPeriod" class="mono text-xs sm:text-sm font-bold text-slate-100">2π</span>
      </div>

      <!-- Posun počátku -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl px-3 py-1.5 sm:py-2 flex items-center justify-between sm:flex-col sm:justify-center text-center shadow-sm">
        <span class="text-[11px] text-slate-400">Posun počátku <span class="mono text-purple-400 font-semibold">x₀ = -C/B</span></span>
        <span id="valPhaseShift" class="mono text-xs sm:text-sm font-bold text-slate-100">0</span>
      </div>

      <!-- Obor hodnot -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl px-3 py-1.5 sm:py-2 flex items-center justify-between sm:flex-col sm:justify-center text-center shadow-sm">
        <span class="text-[11px] text-slate-400">Obor hodnot <span class="mono text-amber-400 font-semibold">H(f)</span></span>
        <span id="valRange" class="mono text-xs sm:text-sm font-bold text-slate-100">⟨-1; 3⟩</span>
      </div>
    </div>

    <!-- Sliders Grid (1 col on mobile, 2 on tablet, 4 on desktop) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 sm:gap-2.5">
      
      <!-- Slider A: Amplituda -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5 sm:p-3 flex flex-col gap-1.5 shadow-sm">
        <div class="flex items-center justify-between text-xs">
          <span class="font-medium text-slate-300">
            <strong class="text-sky-400 mono mr-1">A</strong> Amplituda (výška)
          </span>
          <span id="lblA" class="mono font-bold text-sky-400 bg-sky-400/10 px-1.5 py-0.5 rounded text-xs">2</span>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="stepSlider('sliderA', -0.5)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-90 text-slate-300 font-bold text-xs flex items-center justify-center shrink-0 transition" title="Snížit A">-</button>
          <input id="sliderA" type="range" min="-10" max="10" step="0.5" value="2" class="text-sky-400 flex-1" />
          <button type="button" onclick="stepSlider('sliderA', 0.5)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-90 text-slate-300 font-bold text-xs flex items-center justify-center shrink-0 transition" title="Zvýšit A">+</button>
        </div>
      </div>

      <!-- Slider B: Frekvence / Hustota vln -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5 sm:p-3 flex flex-col gap-1.5 shadow-sm">
        <div class="flex items-center justify-between text-xs">
          <span class="font-medium text-slate-300">
            <strong class="text-emerald-400 mono mr-1">B</strong> Hustota vln (frekvence)
          </span>
          <span id="lblB" class="mono font-bold text-emerald-400 bg-emerald-400/10 px-1.5 py-0.5 rounded text-xs">1</span>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="stepSlider('sliderB', -0.5)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-90 text-slate-300 font-bold text-xs flex items-center justify-center shrink-0 transition" title="Snížit B">-</button>
          <input id="sliderB" type="range" min="0.5" max="6" step="0.5" value="1" class="text-emerald-400 flex-1" />
          <button type="button" onclick="stepSlider('sliderB', 0.5)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-90 text-slate-300 font-bold text-xs flex items-center justify-center shrink-0 transition" title="Zvýšit B">+</button>
        </div>
      </div>

      <!-- Slider C: Fázový posun -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5 sm:p-3 flex flex-col gap-1.5 shadow-sm">
        <div class="flex items-center justify-between text-xs">
          <span class="font-medium text-slate-300">
            <strong class="text-purple-400 mono mr-1">C</strong> Fázový posun (osa X)
          </span>
          <span id="lblC" class="mono font-bold text-purple-400 bg-purple-400/10 px-1.5 py-0.5 rounded text-xs">0</span>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="stepSlider('sliderC', -1)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-90 text-slate-300 font-bold text-xs flex items-center justify-center shrink-0 transition" title="Posunout vlevo">-</button>
          <input id="sliderC" type="range" min="-6" max="6" step="1" value="0" class="text-purple-400 flex-1" />
          <button type="button" onclick="stepSlider('sliderC', 1)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-90 text-slate-300 font-bold text-xs flex items-center justify-center shrink-0 transition" title="Posunout vpravo">+</button>
        </div>
      </div>

      <!-- Slider D: Svislý posun -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5 sm:p-3 flex flex-col gap-1.5 shadow-sm">
        <div class="flex items-center justify-between text-xs">
          <span class="font-medium text-slate-300">
            <strong class="text-amber-400 mono mr-1">D</strong> Svislý posun (osa Y)
          </span>
          <span id="lblD" class="mono font-bold text-amber-400 bg-amber-400/10 px-1.5 py-0.5 rounded text-xs">+1</span>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="stepSlider('sliderD', -0.5)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-90 text-slate-300 font-bold text-xs flex items-center justify-center shrink-0 transition" title="Posunout dolů">-</button>
          <input id="sliderD" type="range" min="-5" max="5" step="0.5" value="1" class="text-amber-400 flex-1" />
          <button type="button" onclick="stepSlider('sliderD', 0.5)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-90 text-slate-300 font-bold text-xs flex items-center justify-center shrink-0 transition" title="Posunout nahoru">+</button>
        </div>
      </div>

    </div>

  </footer>

  <script>
    // --- DOM Elements ---
    const canvas = document.getElementById('sineCanvas');
    const ctx = canvas.getContext('2d');

    const sliderA = document.getElementById('sliderA');
    const sliderB = document.getElementById('sliderB');
    const sliderC = document.getElementById('sliderC');
    const sliderD = document.getElementById('sliderD');

    const lblA = document.getElementById('lblA');
    const lblB = document.getElementById('lblB');
    const lblC = document.getElementById('lblC');
    const lblD = document.getElementById('lblD');

    const eqText = document.getElementById('eqText');
    const valPeriod = document.getElementById('valPeriod');
    const valPhaseShift = document.getElementById('valPhaseShift');
    const valRange = document.getElementById('valRange');
    const hoverCoords = document.getElementById('hoverCoords');
    const mobileHint = document.getElementById('mobileHint');

    const btnNotebook = document.getElementById('btnNotebook');
    const btnCos = document.getElementById('btnCos');
    const btnReset = document.getElementById('btnReset');
    const btnFullscreen = document.getElementById('btnFullscreen');

    // --- State ---
    const state = {
      A: 2,
      B: 1,
      cSixths: 0, // C = cSixths * (π / 6)
      D: 1,
      hoverX: null
    };

    // Helper to step slider value with +/- buttons
    window.stepSlider = function(id, step) {
      const slider = document.getElementById(id);
      if (!slider) return;
      const min = parseFloat(slider.min);
      const max = parseFloat(slider.max);
      let val = parseFloat(slider.value) + step;
      val = Math.max(min, Math.min(max, val));
      slider.value = val;
      syncAndRender();
    };

    // Greatest Common Divisor
    function gcd(a, b) {
      a = Math.abs(Math.round(a));
      b = Math.abs(Math.round(b));
      while (b) {
        const t = b;
        b = a % b;
        a = t;
      }
      return a || 1;
    }

    // Format rational multiple of π: (num / den) * π
    function formatPiFraction(num, den, includePlus = false) {
      if (Math.abs(num) < 1e-9) return '0';
      const sign = num < 0 ? '-' : (includePlus ? '+' : '');
      const absNum = Math.abs(Math.round(num));
      const absDen = Math.abs(Math.round(den));
      const d = gcd(absNum, absDen);
      const n = absNum / d;
      const m = absDen / d;

      const piPart = n === 1 ? 'π' : `${n}π`;
      return m === 1 ? `${sign}${piPart}` : `${sign}${piPart}/${m}`;
    }

    // Czech number formatter (comma as decimal separator)
    function fmtNum(n, plusSign = false) {
      const rounded = Math.round(n * 100) / 100;
      const str = rounded.toString().replace('.', ',');
      if (plusSign && rounded > 0) return '+' + str;
      return str;
    }

    // Update formula and statistical values
    function updateFormulaAndStats() {
      const { A, B, cSixths, D } = state;

      lblA.textContent = fmtNum(A);
      lblB.textContent = fmtNum(B);
      lblC.textContent = formatPiFraction(cSixths, 6, true);
      lblD.textContent = fmtNum(D, true);

      const aPart = `<span class="text-sky-400">${fmtNum(A)}</span>`;
      const bPart = B === 1 ? 'x' : `<span class="text-emerald-400">${fmtNum(B)}</span>x`;
      
      let cPart = '';
      if (cSixths !== 0) {
        const sign = cSixths > 0 ? ' + ' : ' - ';
        const frac = formatPiFraction(Math.abs(cSixths), 6, false);
        cPart = `${sign}<span class="text-purple-400">${frac}</span>`;
      }

      let dPart = '';
      if (D !== 0) {
        const sign = D > 0 ? ' + ' : ' - ';
        dPart = `${sign}<span class="text-amber-400">${fmtNum(Math.abs(D))}</span>`;
      }

      eqText.innerHTML = `${aPart}·sin(${bPart}${cPart})${dPart}`;

      // Period T = 2π / |B|
      const twoB = Math.round(Math.abs(B) * 2);
      valPeriod.textContent = formatPiFraction(4, twoB, false);

      // Phase Shift x0 = -C / B
      if (cSixths === 0) {
        valPhaseShift.textContent = '0';
      } else {
        const num = -2 * cSixths;
        const den = 6 * twoB;
        const dir = num > 0 ? ' (vpravo →)' : ' (vlevo ←)';
        valPhaseShift.textContent = formatPiFraction(num, den, true) + dir;
      }

      // Range H(f) = [D - |A|, D + |A|]
      const minVal = D - Math.abs(A);
      const maxVal = D + Math.abs(A);
      valRange.textContent = `⟨${fmtNum(minVal)}; ${fmtNum(maxVal)}⟩`;
    }

    // Dynamic Y-axis bounds
    function getYBounds() {
      const minWave = state.D - Math.abs(state.A);
      const maxWave = state.D + Math.abs(state.A);
      const yMin = Math.min(-4, Math.floor(minWave - 1.5));
      const yMax = Math.max(4, Math.ceil(maxWave + 1.5));
      return { yMin, yMax };
    }

    // High-DPI Canvas Rendering
    function drawGraph() {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const W = rect.width;
      const H = rect.height;

      // Responsive padding
      const padLeft = W < 500 ? 32 : 44;
      const padRight = W < 500 ? 12 : 24;
      const padTop = 32;
      const padBottom = 26;

      const plotW = W - padLeft - padRight;
      const plotH = H - padTop - padBottom;

      const xMin = -2 * Math.PI;
      const xMax = 2 * Math.PI;
      const { yMin, yMax } = getYBounds();

      const toPxX = (x) => padLeft + ((x - xMin) / (xMax - xMin)) * plotW;
      const toPxY = (y) => padTop + ((yMax - y) / (yMax - yMin)) * plotH;
      const toMathX = (px) => xMin + ((px - padLeft) / plotW) * (xMax - xMin);

      // Clear Canvas
      ctx.clearRect(0, 0, W, H);

      // Shaded Band for H(f)
      const yTopBand = toPxY(state.D + Math.abs(state.A));
      const yBotBand = toPxY(state.D - Math.abs(state.A));
      ctx.fillStyle = 'rgba(56, 189, 248, 0.06)';
      ctx.fillRect(padLeft, yTopBand, plotW, Math.max(1, yBotBand - yTopBand));

      // --- Horizontal Gridlines (Y-axis) ---
      const ySpan = yMax - yMin;
      let yStep = 2;
      if (ySpan > 18) yStep = 5;
      else if (ySpan > 10) yStep = 4;
      else if (H > 380 && ySpan <= 8) yStep = 1;

      ctx.font = '10px JetBrains Mono, monospace';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';

      for (let y = Math.ceil(yMin / yStep) * yStep; y <= yMax; y += yStep) {
        const py = toPxY(y);
        ctx.beginPath();
        ctx.strokeStyle = y === 0 ? '#475569' : '#1e293b';
        ctx.lineWidth = y === 0 ? 1.5 : 1;
        ctx.moveTo(padLeft, py);
        ctx.lineTo(W - padRight, py);
        ctx.stroke();

        ctx.fillStyle = y === 0 ? '#e2e8f0' : '#64748b';
        ctx.fillText(y.toString(), padLeft - 6, py);
      }

      // --- Vertical Gridlines (X-axis) ---
      const xTicks = [
        { val: -2 * Math.PI, lbl: '-2π', major: true },
        { val: -1.5 * Math.PI, lbl: '-3π/2', major: false },
        { val: -Math.PI, lbl: '-π', major: true },
        { val: -0.5 * Math.PI, lbl: '-π/2', major: false },
        { val: 0, lbl: '0', major: true },
        { val: 0.5 * Math.PI, lbl: 'π/2', major: false },
        { val: Math.PI, lbl: 'π', major: true },
        { val: 1.5 * Math.PI, lbl: '3π/2', major: false },
        { val: 2 * Math.PI, lbl: '2π', major: true }
      ];

      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      xTicks.forEach((t) => {
        const px = toPxX(t.val);
        ctx.beginPath();
        const isAxis = Math.abs(t.val) < 1e-6;
        ctx.strokeStyle = isAxis ? '#475569' : '#1e293b';
        ctx.lineWidth = isAxis ? 1.5 : 1;
        ctx.moveTo(px, padTop);
        ctx.lineTo(px, H - padBottom);
        ctx.stroke();

        // On narrow mobile screens, display major ticks to prevent overlapping labels
        const showLabel = W >= 480 || t.major;
        if (showLabel) {
          ctx.fillStyle = isAxis ? '#e2e8f0' : '#64748b';
          ctx.fillText(t.lbl, px, H - padBottom + 6);
        }
      });

      // --- Dotted Line for Center Axis y = D ---
      const pyD = toPxY(state.D);
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 1.3;
      ctx.moveTo(padLeft, pyD);
      ctx.lineTo(W - padRight, pyD);
      ctx.stroke();
      ctx.restore();

      // --- Dashed Reference Curve: sin(x) ---
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 1.5;
      const refSamples = Math.max(300, Math.floor(W * 1.5));
      for (let i = 0; i <= refSamples; i++) {
        const x = xMin + (i / refSamples) * (xMax - xMin);
        const y = Math.sin(x);
        const px = toPxX(x);
        const py = toPxY(y);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();

      // --- Main Curve: y = A sin(Bx + C) + D ---
      const C = (state.cSixths * Math.PI) / 6;
      ctx.save();
      ctx.beginPath();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.6;
      ctx.shadowColor = 'rgba(56, 189, 248, 0.4)';
      ctx.shadowBlur = 6;

      const mainSamples = Math.max(450, Math.floor(W * 2));
      for (let i = 0; i <= mainSamples; i++) {
        const x = xMin + (i / mainSamples) * (xMax - xMin);
        const y = state.A * Math.sin(state.B * x + C) + state.D;
        const px = toPxX(x);
        const py = toPxY(y);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();

      // --- Highlight Starting Point (x0, D) ---
      const x0 = -C / state.B;
      if (x0 >= xMin && x0 <= xMax) {
        const px0 = toPxX(x0);
        const py0 = toPxY(state.D);
        ctx.beginPath();
        ctx.arc(px0, py0, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#c084fc';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#0f172a';
        ctx.stroke();
      }

      // --- Interactive Hover / Touch Crosshair ---
      if (state.hoverX !== null && state.hoverX >= padLeft && state.hoverX <= W - padRight) {
        const mathX = toMathX(state.hoverX);
        const mathY = state.A * Math.sin(state.B * mathX + C) + state.D;
        const py = toPxY(mathY);

        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([2, 2]);
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.2;
        ctx.moveTo(state.hoverX, padTop);
        ctx.lineTo(state.hoverX, H - padBottom);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(state.hoverX, py, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        ctx.restore();

        const xPi = (mathX / Math.PI).toFixed(2).replace('.', ',') + 'π';
        hoverCoords.textContent = `x ≈ ${xPi} (${fmtNum(mathX)}) | y = ${fmtNum(mathY)}`;
        hoverCoords.classList.remove('hidden');
      }
    }

    function syncAndRender() {
      state.A = parseFloat(sliderA.value);
      state.B = parseFloat(sliderB.value);
      state.cSixths = parseInt(sliderC.value, 10);
      state.D = parseFloat(sliderD.value);
      updateFormulaAndStats();
      drawGraph();
    }

    // --- Event Listeners for Sliders ---
    [sliderA, sliderB, sliderC, sliderD].forEach((el) => {
      el.addEventListener('input', syncAndRender);
    });

    // Preset 1: Ze sešitu: 10 sin(3x + π) + 3
    btnNotebook.addEventListener('click', () => {
      sliderA.value = 10;
      sliderB.value = 3;
      sliderC.value = 6; // 6 * (π/6) = +π
      sliderD.value = 3;
      syncAndRender();
    });

    // Preset 2: cos(x)
    btnCos.addEventListener('click', () => {
      sliderA.value = 1;
      sliderB.value = 1;
      sliderC.value = 3; // +π/2
      sliderD.value = 0;
      syncAndRender();
    });

    // Preset 3: Base sin(x)
    btnReset.addEventListener('click', () => {
      sliderA.value = 1;
      sliderB.value = 1;
      sliderC.value = 0;
      sliderD.value = 0;
      syncAndRender();
    });

    // Fullscreen Toggle
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      btnFullscreen.classList.toggle('bg-sky-600', isFs);
      btnFullscreen.classList.toggle('text-white', isFs);
      drawGraph();
    });

    // Pointer / Touch Interaction
    function handlePointer(e) {
      if (mobileHint) mobileHint.style.display = 'none';
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      state.hoverX = clientX - rect.left;
      drawGraph();
    }

    canvas.addEventListener('mousemove', handlePointer);
    canvas.addEventListener('touchstart', handlePointer, { passive: true });
    canvas.addEventListener('touchmove', handlePointer, { passive: true });
    canvas.addEventListener('mouseleave', () => {
      state.hoverX = null;
      hoverCoords.classList.add('hidden');
      drawGraph();
    });

    // Observe size changes smoothly (responsive + orientation changes)
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => {
        drawGraph();
      });
      ro.observe(canvas.parentElement);
    } else {
      window.addEventListener('resize', drawGraph);
    }

    window.onload = syncAndRender;
  </script>
</body>
</html>
